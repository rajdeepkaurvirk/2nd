<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidak & Alam | Wedding Countdown</title>
  <style>
    :root { --navy:#122a45; --deep-navy:#081b31; --blush:#f7d8d5; --soft-blush:#fce9e5; --cream:#fffaf6; --gold:#bd8b54; --rose-gold:#c88e89; --shadow:rgba(35,24,30,.2); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100svh; color:var(--navy); font-family:Georgia,"Times New Roman",serif; background:linear-gradient(rgba(248,215,212,.74),rgba(252,232,227,.84)),url("IMG_0511.jpeg") center/cover fixed; display:flex; justify-content:center; align-items:center; overflow-x:hidden; padding:18px; }
    .page { width:100%; max-width:560px; min-height:calc(100svh - 36px); display:flex; justify-content:center; align-items:center; position:relative; padding:14px; }
    .card { width:100%; min-height:720px; position:relative; overflow:hidden; display:flex; justify-content:center; align-items:center; padding:34px 18px; border:1px solid rgba(189,139,84,.85); border-radius:48% 48% 24px 24px / 17% 17% 18px 18px; background:linear-gradient(rgba(255,250,246,.88),rgba(255,248,244,.9)),url("IMG_0510.jpeg") center/cover; box-shadow:0 15px 40px var(--shadow),inset 0 0 0 5px rgba(255,255,255,.3); }
    .card::before { content:""; position:absolute; inset:10px; border:1px solid rgba(189,139,84,.55); border-radius:48% 48% 17px 17px / 16% 16% 12px 12px; pointer-events:none; }
    .card::after { content:""; position:absolute; inset:23px; border:1px solid rgba(200,142,137,.35); border-radius:48% 48% 12px 12px / 15% 15% 10px 10px; pointer-events:none; }
    .content { width:100%; max-width:440px; position:relative; z-index:2; text-align:center; }
    .eyebrow { color:var(--rose-gold); font-size:.7rem; letter-spacing:.28em; text-transform:uppercase; margin-bottom:17px; }
    .monogram { width:118px; height:118px; margin:0 auto 19px; position:relative; display:flex; justify-content:center; align-items:center; color:var(--navy); border:1px solid var(--gold); border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.92),rgba(255,247,242,.58)); box-shadow:0 0 0 7px rgba(189,139,84,.12),0 0 0 10px rgba(255,255,255,.38); }
    .monogram::before,.monogram::after { content:""; position:absolute; width:35px; height:1px; background:var(--gold); top:50%; }
    .monogram::before { left:-44px; } .monogram::after { right:-44px; }
    .letter { position:absolute; font-size:3.2rem; line-height:1; font-style:italic; font-weight:normal; } .letter.s { transform:translate(-13px,-7px); } .letter.a { transform:translate(13px,7px); }
    .ampersand { position:absolute; font-size:1.05rem; color:var(--gold); transform:translate(0,1px); z-index:3; }
    h1 { color:var(--navy); font-weight:normal; font-size:clamp(2.3rem,11vw,4.1rem); line-height:.96; letter-spacing:.08em; text-transform:uppercase; text-shadow:0 1px 0 #fff; }
    .names { margin-top:13px; font-size:.76rem; letter-spacing:.3em; text-transform:uppercase; color:var(--deep-navy); } .names span { color:var(--rose-gold); margin:0 8px; letter-spacing:normal; }
    .date { margin-top:23px; color:var(--navy); font-size:.94rem; letter-spacing:.28em; text-transform:uppercase; }
    .ornament { width:150px; margin:19px auto 24px; display:flex; align-items:center; gap:8px; color:var(--gold); } .ornament::before,.ornament::after { content:""; height:1px; flex:1; background:var(--gold); } .ornament span { font-size:.9rem; }
    .countdown { width:100%; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:4px; }
    .timepiece { min-height:94px; position:relative; display:flex; flex-direction:column; justify-content:center; align-items:center; color:var(--cream); border:1px solid var(--gold); border-radius:50%; aspect-ratio:1/1; background:radial-gradient(circle at 35% 25%,rgba(53,83,112,.98),rgba(8,27,49,.98)); box-shadow:inset 0 0 0 5px rgba(255,255,255,.06),inset 0 0 0 7px rgba(189,139,84,.22),0 7px 15px rgba(8,27,49,.18); }
    .timepiece::before { content:""; position:absolute; inset:8px; border:1px dotted rgba(255,226,198,.52); border-radius:50%; } .timepiece::after { content:""; width:5px; height:5px; position:absolute; top:13px; right:25px; border-radius:50%; background:#ffd9cf; box-shadow:0 0 8px 2px #ffd9cf; animation:pulseLight 1.4s ease-in-out infinite; }
    .number { position:relative; z-index:1; font-family:"Trebuchet MS",Arial,sans-serif; font-size:clamp(1.8rem,8vw,2.65rem); font-weight:300; letter-spacing:.05em; line-height:1; } .label { position:relative; z-index:1; margin-top:8px; color:#f4cfc8; font-family:"Trebuchet MS",Arial,sans-serif; font-size:.57rem; letter-spacing:.2em; text-transform:uppercase; }
    .message { margin:25px auto 0; max-width:320px; color:var(--navy); font-size:.95rem; line-height:1.65; font-style:italic; } .footer { margin-top:25px; color:var(--rose-gold); font-family:"Trebuchet MS",Arial,sans-serif; font-size:.61rem; letter-spacing:.25em; text-transform:uppercase; }
    .lights { position:absolute; inset:0; z-index:3; pointer-events:none; } .light { width:6px; height:6px; position:absolute; border-radius:50%; background:#ffd8ce; box-shadow:0 0 6px 2px rgba(255,205,193,.95),0 0 14px 3px rgba(201,142,137,.65); animation:blink 2.2s ease-in-out infinite; }
    .light:nth-child(1){top:5%;left:24%;animation-delay:.2s}.light:nth-child(2){top:3%;left:48%;animation-delay:1.1s}.light:nth-child(3){top:6%;right:22%;animation-delay:.7s}.light:nth-child(4){top:27%;right:3%;animation-delay:1.5s}.light:nth-child(5){top:53%;right:2%;animation-delay:.4s}.light:nth-child(6){bottom:26%;right:5%;animation-delay:1.7s}.light:nth-child(7){bottom:7%;right:26%;animation-delay:.8s}.light:nth-child(8){bottom:4%;left:49%;animation-delay:1.3s}.light:nth-child(9){bottom:8%;left:22%;animation-delay:.1s}.light:nth-child(10){bottom:27%;left:4%;animation-delay:1.9s}.light:nth-child(11){top:52%;left:2%;animation-delay:.9s}.light:nth-child(12){top:27%;left:4%;animation-delay:1.6s}
    @keyframes blink { 0%,100%{opacity:.28;transform:scale(.75)} 50%{opacity:1;transform:scale(1.35)} } @keyframes pulseLight { 0%,100%{opacity:.35;transform:scale(.75)} 50%{opacity:1;transform:scale(1.3)} }
    @media (min-width:500px) { body{padding:30px}.page{min-height:calc(100svh - 60px)}.card{min-height:800px;padding:54px 42px}.countdown{grid-template-columns:repeat(4,1fr);gap:8px}.timepiece{min-height:76px}.number{font-size:1.65rem}.label{font-size:.48rem} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Wedding countdown for Sidak and Alam">
      <div class="lights" aria-hidden="true"><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span></div>
      <div class="content">
        <p class="eyebrow">The countdown begins</p>
        <div class="monogram" aria-label="S and A monogram"><span class="letter s">S</span><span class="ampersand">&amp;</span><span class="letter a">A</span></div>
        <h1>Sidak<br />&amp; Alam</h1>
        <p class="names">Bride <span>·</span> Groom</p>
        <p class="date">November 11, 2027</p>
        <div class="ornament" aria-hidden="true"><span>✦</span></div>
        <div class="countdown" aria-live="polite">
          <div class="timepiece"><span class="number" id="days">000</span><span class="label">Days</span></div>
          <div class="timepiece"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
          <div class="timepiece"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
          <div class="timepiece"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
        </div>
        <p class="message">Two hearts, one beautiful beginning, and a lifetime of moments waiting to unfold.</p>
        <p class="footer">Save the date · 11 · 11 · 27</p>
      </div>
    </section>
  </main>
  <script>
    const weddingDate = new Date("November 11, 2027 00:00:00").getTime();
    const daysElement = document.getElementById("days");
    const hoursElement = document.getElementById("hours");
    const minutesElement = document.getElementById("minutes");
    const secondsElement = document.getElementById("seconds");
    function formatNumber(value, digits) { return String(value).padStart(digits, "0"); }
    function updateCountdown() {
      const distance = weddingDate - Date.now();
      if (distance <= 0) { daysElement.textContent="000"; hoursElement.textContent="00"; minutesElement.textContent="00"; secondsElement.textContent="00"; return; }
      const days = Math.floor(distance / 86400000);
      const hours = Math.floor((distance % 86400000) / 3600000);
      const minutes = Math.floor((distance % 3600000) / 60000);
      const seconds = Math.floor((distance % 60000) / 1000);
      daysElement.textContent = formatNumber(days, 3);
      hoursElement.textContent = formatNumber(hours, 2);
      minutesElement.textContent = formatNumber(minutes, 2);
      secondsElement.textContent = formatNumber(seconds, 2);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
